name: Build MobiloSignal APK

# Запускается только вручную. Перед запуском выбери тип сборки в интерфейсе Actions.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Тип сборки"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  GRADLE_PROJECT_DIR: mobilosignal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}

      # Генерируем одноразовый keystore. Пароли в hex — без спецсимволов,
      # которые могли бы сломать $GITHUB_ENV или ::add-mask::.
      - name: Generate ephemeral signing key
        id: gen_key
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          set -euo pipefail

          STORE_PASS="$(openssl rand -hex 32)"
          KEY_PASS="$(openssl rand -hex 32)"
          KEY_ALIAS="key-$(openssl rand -hex 4)"
          KEYSTORE_PATH="${{ github.workspace }}/${{ env.GRADLE_PROJECT_DIR }}/ephemeral.keystore"

          echo "::add-mask::${STORE_PASS}"
          echo "::add-mask::${KEY_PASS}"

          keytool -genkeypair -v \
            -keystore "${KEYSTORE_PATH}" \
            -storetype PKCS12 \
            -alias "${KEY_ALIAS}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${STORE_PASS}" -keypass "${KEY_PASS}" \
            -dname "CN=Ephemeral Build, OU=CI, O=CI, L=CI, S=CI, C=XX"

          printf 'KEYSTORE_PATH=%s\n' "${KEYSTORE_PATH}" >> "$GITHUB_ENV"
          printf 'KEYSTORE_PASSWORD=%s\n' "${STORE_PASS}" >> "$GITHUB_ENV"
          printf 'KEY_ALIAS=%s\n' "${KEY_ALIAS}" >> "$GITHUB_ENV"
          printf 'KEY_PASSWORD=%s\n' "${KEY_PASS}" >> "$GITHUB_ENV"

      # Патчим app/build.gradle: добавляем signingConfigs и привязываем
      # его к нужному buildType (debug или release).
      - name: Wire signing config into build.gradle
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          python3 - "${BUILD_TYPE}" <<'EOF'
          import re, sys

          build_type = sys.argv[1]
          path = "app/build.gradle"
          with open(path) as f:
              content = f.read()

          signing_configs_block = f'''
              signingConfigs {{
                  {build_type} {{
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }}
              }}
          '''

          # Вставляем signingConfigs сразу после открытия блока android {
          content = content.replace(
              "android {\n",
              "android {\n" + signing_configs_block,
              1,
          )

          # Работаем с текстом после "buildTypes {"
          bt_match = re.search(r"buildTypes\s*\{", content)
          if not bt_match:
              raise SystemExit(f"'buildTypes {{' block not found in {path}")
          bt_start = bt_match.end()

          head, tail = content[:bt_start], content[bt_start:]

          existing_block = re.search(rf"\b{build_type}\s*\{{", tail)
          if existing_block:
              insert_at = existing_block.end()
              tail = (
                  tail[:insert_at]
                  + f"\n            signingConfig signingConfigs.{build_type}"
                  + tail[insert_at:]
              )
          else:
              new_block = f"\n        {build_type} {{\n            signingConfig signingConfigs.{build_type}\n        }}\n"
              tail = new_block + tail

          content = head + tail

          with open(path, "w") as f:
              f.write(content)

          print(f"--- patched {path} ---")
          print(content)
          EOF
        env:
          BUILD_TYPE: ${{ inputs.build_type }}

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: ${{ inputs.build_type == 'release' }}
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/${{ inputs.build_type }} -name "*.apk" | head -n1)
          echo "Found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilosignal-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.GRADLE_PROJECT_DIR }}/${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14