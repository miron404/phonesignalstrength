name: Build MobiloSignal APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Тип сборки"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  GRADLE_PROJECT_DIR: mobilosignal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}

      - name: Generate ephemeral signing key
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          set -euo pipefail

          STORE_PASS="$(openssl rand -hex 32)"
          KEY_PASS="$(openssl rand -hex 32)"
          KEY_ALIAS="key-$(openssl rand -hex 4)"
          KEYSTORE_FILE="ephemeral.keystore"

          echo "::add-mask::${STORE_PASS}"
          echo "::add-mask::${KEY_PASS}"

          keytool -genkeypair -v \
            -keystore "${KEYSTORE_FILE}" \
            -storetype PKCS12 \
            -alias "${KEY_ALIAS}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${STORE_PASS}" -keypass "${KEY_PASS}" \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=XX"

          # Verify keystore is readable with these passwords
          echo "::group::Verify keystore"
          keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${STORE_PASS}" -storetype PKCS12
          echo "::endgroup::"

          cat > keystore.properties <<PROPEOF
          KEYSTORE_FILE=${KEYSTORE_FILE}
          KEYSTORE_PASSWORD=${STORE_PASS}
          KEY_ALIAS=${KEY_ALIAS}
          KEY_PASSWORD=${KEY_PASS}
          PROPEOF

      - name: Build unsigned APK
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Sign APK with apksigner
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          # Read values back from keystore.properties
          KS_FILE=$(grep KEYSTORE_FILE keystore.properties | cut -d= -f2)
          KS_PASS=$(grep KEYSTORE_PASSWORD keystore.properties | cut -d= -f2)
          KS_ALIAS=$(grep KEY_ALIAS keystore.properties | cut -d= -f2)
          KS_KEYPASS=$(grep KEY_PASSWORD keystore.properties | cut -d= -f2)

          APKSIGNER=$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -r | head -n1)
          echo "Using apksigner: ${APKSIGNER}"

          APK_DIR="app/build/outputs/apk/${{ inputs.build_type }}"
          UNSIGNED_APK=$(find "${APK_DIR}" -name "*.apk" | head -n1)
          SIGNED_APK="${UNSIGNED_APK%.apk}-signed.apk"

          echo "Unsigned: ${UNSIGNED_APK}"
          echo "Signed:   ${SIGNED_APK}"

          "${APKSIGNER}" sign \
            --ks "${KS_FILE}" \
            --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias "${KS_ALIAS}" \
            --key-pass "pass:${KS_KEYPASS}" \
            --out "${SIGNED_APK}" \
            "${UNSIGNED_APK}"

          echo "::group::Verify signed APK"
          "${APKSIGNER}" verify --verbose "${SIGNED_APK}"
          echo "::endgroup::"

          # Replace unsigned with signed so artifact upload picks it up
          rm "${UNSIGNED_APK}"
          mv "${SIGNED_APK}" "${UNSIGNED_APK}"

      - name: Locate APK
        id: find_apk
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/${{ inputs.build_type }} -name "*.apk" | head -n1)
          echo "Found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilosignal-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.GRADLE_PROJECT_DIR }}/${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14