name: Build MobiloSignal APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Тип сборки"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  GRADLE_PROJECT_DIR: mobilosignal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}

      - name: Generate ephemeral signing key + keystore.properties
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          set -euo pipefail

          STORE_PASS="$(openssl rand -hex 32)"
          KEY_PASS="$(openssl rand -hex 32)"
          KEY_ALIAS="key-$(openssl rand -hex 4)"
          KEYSTORE_FILE="ephemeral.keystore"

          echo "::add-mask::${STORE_PASS}"
          echo "::add-mask::${KEY_PASS}"

          keytool -genkeypair -v \
            -keystore "${KEYSTORE_FILE}" \
            -storetype PKCS12 \
            -alias "${KEY_ALIAS}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${STORE_PASS}" -keypass "${KEY_PASS}" \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=XX"

          cat > keystore.properties <<PROPEOF
          KEYSTORE_FILE=${KEYSTORE_FILE}
          KEYSTORE_PASSWORD=${STORE_PASS}
          KEY_ALIAS=${KEY_ALIAS}
          KEY_PASSWORD=${KEY_PASS}
          PROPEOF

      # Python читает keystore.properties и вшивает значения напрямую
      # в build.gradle строковыми литералами — никаких Properties.load()
      # и System.getenv() на стороне Gradle.
      - name: Wire signing config into build.gradle
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          python3 - "${BUILD_TYPE}" <<'PYEOF'
          import re, sys

          build_type = sys.argv[1]

          # Read keystore properties
          props = {}
          with open("keystore.properties") as f:
              for line in f:
                  line = line.strip()
                  if line and '=' in line:
                      k, v = line.split('=', 1)
                      props[k.strip()] = v.strip()

          ks_file = props['KEYSTORE_FILE']
          ks_pass = props['KEYSTORE_PASSWORD']
          ks_alias = props['KEY_ALIAS']
          ks_keypass = props['KEY_PASSWORD']

          path = "app/build.gradle"
          with open(path) as f:
              content = f.read()

          signing_configs_block = f'''    signingConfigs {{
                  ci {{
                      storeFile rootProject.file("{ks_file}")
                      storePassword "{ks_pass}"
                      keyAlias "{ks_alias}"
                      keyPassword "{ks_keypass}"
                  }}
              }}
          '''

          content = content.replace(
              "android {\n",
              "android {\n" + signing_configs_block,
              1,
          )

          bt_match = re.search(r"buildTypes\s*\{", content)
          if not bt_match:
              raise SystemExit(f"'buildTypes {{' block not found in {path}")
          bt_start = bt_match.end()

          head, tail = content[:bt_start], content[bt_start:]

          existing_block = re.search(rf"\b{build_type}\s*\{{", tail)
          if existing_block:
              insert_at = existing_block.end()
              tail = (
                  tail[:insert_at]
                  + "\n            signingConfig signingConfigs.ci"
                  + tail[insert_at:]
              )
          else:
              new_block = f"\n        {build_type} {{\n            signingConfig signingConfigs.ci\n        }}\n"
              tail = new_block + tail

          content = head + tail

          with open(path, "w") as f:
              f.write(content)

          print(f"--- patched {path} ---")
          print(content)
          PYEOF
        env:
          BUILD_TYPE: ${{ inputs.build_type }}

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: ${{ inputs.build_type == 'release' }}
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/${{ inputs.build_type }} -name "*.apk" | head -n1)
          echo "Found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilosignal-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.GRADLE_PROJECT_DIR }}/${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14