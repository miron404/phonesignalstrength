name: Build MobiloSignal APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Тип сборки"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  GRADLE_PROJECT_DIR: mobilosignal

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional. With these four repository secrets set, every build is signed with the same key,
      # so a new APK installs over the previous one. Without them each run signs with a throwaway
      # key, and the APK has to be uninstalled (losing its settings) before the next one fits.
      #   SIGNING_KEYSTORE_BASE64  base64 of the keystore file (JKS or PKCS12)
      #   SIGNING_STORE_PASSWORD   keystore password
      #   SIGNING_KEY_ALIAS        key alias
      #   SIGNING_KEY_PASSWORD     key password
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy "tools" package, which the SDK
          # repository no longer has, and sdkmanager then fails the whole step. Gradle installs
          # the platform and build tools it needs by itself.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}

      - name: Run unit tests
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build unsigned APK
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Sign APK
        id: sign
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="${RUNNER_TEMP}/signing.keystore"
          KS_TYPE_ARGS=()

          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "Signing with the key from the repository secrets"
            echo "${SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            STORE_PASS="${SIGNING_STORE_PASSWORD}"
            KEY_ALIAS="${SIGNING_KEY_ALIAS}"
            KEY_PASS="${SIGNING_KEY_PASSWORD}"
          else
            echo "::warning::No signing secrets set: signing with a throwaway key. This APK will not install over a previous build."
            STORE_PASS="$(openssl rand -hex 32)"
            KEY_PASS="$(openssl rand -hex 32)"
            KEY_ALIAS="key-$(openssl rand -hex 4)"
            echo "::add-mask::${STORE_PASS}"
            echo "::add-mask::${KEY_PASS}"

            # JKS rather than PKCS12, to avoid the JDK 17 PKCS12 PBES2 padding bug.
            keytool -genkeypair \
              -keystore "${KEYSTORE_FILE}" \
              -storetype JKS \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${STORE_PASS}" -keypass "${KEY_PASS}" \
              -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=XX"
            KS_TYPE_ARGS=(--ks-type JKS)
          fi

          APKSIGNER=$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n1)
          echo "Using apksigner: ${APKSIGNER}"

          APK_DIR="app/build/outputs/apk/${{ inputs.build_type }}"
          UNSIGNED_APK=$(find "${APK_DIR}" -name "*.apk" | head -n1)
          SIGNED_APK="${APK_DIR}/mobilosignal-${{ inputs.build_type }}.apk"

          echo "Input:  ${UNSIGNED_APK}"
          echo "Output: ${SIGNED_APK}"

          "${APKSIGNER}" sign \
            --ks "${KEYSTORE_FILE}" \
            "${KS_TYPE_ARGS[@]}" \
            --ks-pass "pass:${STORE_PASS}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASS}" \
            --out "${SIGNED_APK}" \
            "${UNSIGNED_APK}"

          echo "::group::Verify signed APK"
          "${APKSIGNER}" verify --verbose "${SIGNED_APK}"
          echo "::endgroup::"

          rm -f "${KEYSTORE_FILE}" "${UNSIGNED_APK}" "${SIGNED_APK}.idsig"
          echo "apk_path=${SIGNED_APK}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilosignal-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ env.GRADLE_PROJECT_DIR }}/${{ steps.sign.outputs.apk_path }}
          retention-days: 14
